name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  language-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package language server
        run: |
          chmod +x scripts/package-lsp.sh
          ./scripts/package-lsp.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hover-translate-lsp.zip
