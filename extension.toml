id = "hover-translate-lsp"
name = "Hover Translate"
version = "0.1.0"
schema_version = 1
authors = ["hviwen"]
description = "Hover over a word or phrase to translate between English and Chinese, with LLM support, a translation memory and offline vocabulary books."
repository = "https://github.com/hviwen/zedg-translate"

[language_servers.hover-translate-lsp]
name = "hover-translate-lsp"
languages = [
  "Markdown",
  "Plain Text",
  "Python",
  "Rust",
  "Go",
  "TypeScript",
  "TSX",
  "JavaScript",
  "JSON",
  "JSONC",
  "YAML",
  "TOML",
  "Java",
  "Kotlin",
  "Swift",
  "C",
  "C++",
  "C#",
  "Ruby",
  "PHP",
  "Shell Script",
  "SQL",
  "HTML",
  "CSS",
  "SCSS",
  "LESS",
  "Vue.js",
  "Svelte",
  "Lua",
  "Dockerfile",
  "Make",
  "XML",
  "Org",
  "Dart",
  "Elixir",
  "Erlang",
  "Haskell",
  "Scala",
  "Perl",
  "R",
  "Zig",
  "Astro",
  "ERB",
  "Jinja2",
  "HEEx",
]

[language_servers.hover-translate-lsp.language_ids]
"Plain Text" = "plaintext"
